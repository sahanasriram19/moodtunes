<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- no white flash between pages: paint the theme's background colour from the
       very first frame, before any stylesheet or script has loaded -->
  <meta name="color-scheme" content="dark" />
  <style>html{background:#120a20;color-scheme:dark}</style>
  <script>
    (function () {
      var bg = { default: '#120a20', warm: '#0a0a0a', purple: '#08061a', light: '#f8f8f6' };
      var t = 'default';
      try { t = localStorage.getItem('moodtunes_theme') || 'default'; } catch (e) {}
      if (!bg[t]) t = 'default';
      var root = document.documentElement;
      root.setAttribute('data-theme', t);
      root.style.background = bg[t];
      root.style.colorScheme = t === 'light' ? 'light' : 'dark';
      var meta = document.querySelector('meta[name="color-scheme"]');
      if (meta) meta.content = t === 'light' ? 'light' : 'dark';
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- installable app (PWA) -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f0f0f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="moodtunes" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="images/favicon.png" />
  <title>Login</title>
  <!-- fonts: connect early and load in parallel with the other stylesheets -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://moodtunes-2avk.onrender.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&amp;family=Outfit:wght@300..700&amp;display=swap" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <main class="auth-container">
    <div class="auth-box">
      <h1 class="sr-only">log in to moodtunes</h1>
      <img src="images/moodtunes_logo.png" class="auth-logo-img" alt="moodtunes logo">
      <p class="auth-tagline">a journal for the songs you play on spotify, sorted by how they make you feel.</p>
      <ul class="auth-moods" aria-label="the moods you start with">
        <li style="--c:#f2c84b">happy</li><li style="--c:#378add">sad</li><li style="--c:#b07a50">hype</li><li style="--c:#d4537e">heartbreak</li><li style="--c:#7f77dd">nostalgic</li><li style="--c:#1D9E75">focused</li><li style="--c:#888780">chill</li>
      </ul>

      <p class="auth-notice" id="auth-notice" hidden></p>

      <div class="auth-tabs">
        <button class="auth-tab active" id="login-tab">log in</button>
        <button class="auth-tab" id="register-tab">sign up</button>
      </div>

      <div id="login-form">
        <div class="auth-field">
          <label>username</label>
          <input type="text" id="login-username" placeholder="your username" />
        </div>
        <div class="auth-field">
          <label>password</label>
          <input type="password" id="login-password" placeholder="your password" />
        </div>
        <button class="auth-btn" id="login-btn">log in</button>
        <p class="auth-error" id="login-error"></p>
        <button type="button" class="auth-link" id="forgot-link">forgot your password?</button>
      </div>

      <div id="forgot-form" style="display:none;">
        <p class="auth-help">enter the email you signed up with and we’ll send you a link to set a new password.</p>
        <div class="auth-field">
          <label for="forgot-email">email</label>
          <input type="email" id="forgot-email" placeholder="your email" autocomplete="email" />
        </div>
        <button class="auth-btn" id="forgot-btn">send reset link</button>
        <p class="auth-error" id="forgot-error"></p>
        <button type="button" class="auth-link" id="forgot-back">← back to log in</button>
      </div>

      <div id="register-form" style="display:none;">
        <div class="auth-field">
          <label>username</label>
          <input type="text" id="reg-username" placeholder="choose a username" />
        </div>
        <div class="auth-field">
          <label>email</label>
          <input type="email" id="reg-email" placeholder="your email" />
        </div>
        <div class="auth-field">
          <label>password</label>
          <input type="password" id="reg-password" placeholder="choose a password" />
        </div>
        <button class="auth-btn" id="register-btn">create account</button>
        <p class="auth-error" id="register-error"></p>
      </div>
    </div>
  </main>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
