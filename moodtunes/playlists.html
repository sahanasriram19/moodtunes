<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- no white flash between pages: paint the theme's background colour from the
       very first frame, before any stylesheet or script has loaded -->
  <meta name="color-scheme" content="dark" />
  <style>html{background:#120a20;color-scheme:dark}</style>
  <script>
    (function () {
      var bg = { default: '#120a20', warm: '#0a0a0a', purple: '#08061a', light: '#f8f8f6' };
      var t = 'default';
      try { t = localStorage.getItem('moodtunes_theme') || 'default'; } catch (e) {}
      if (!bg[t]) t = 'default';
      var root = document.documentElement;
      root.setAttribute('data-theme', t);
      root.style.background = bg[t];
      root.style.colorScheme = t === 'light' ? 'light' : 'dark';
      var meta = document.querySelector('meta[name="color-scheme"]');
      if (meta) meta.content = t === 'light' ? 'light' : 'dark';
    })();
  </script>
  <!-- page opening animation: the content fades and rises in (see "PAGE OPENING" in
       motion.css). started here, and again when a page prepared in the background or
       kept by the back button is shown, so it always plays as you arrive -->
  <script>
    (function () {
      var root = document.documentElement;
      function enter() {
        root.classList.remove('mt-enter');
        void root.offsetWidth;
        root.classList.add('mt-enter');
      }
      if (document.prerendering) document.addEventListener('prerenderingchange', enter, { once: true });
      else enter();
      addEventListener('pageshow', function (e) { if (e.persisted) { root.classList.remove('mt-leave'); enter(); } });
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- installable app (PWA) -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f0f0f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="moodtunes" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="images/favicon.png" />
  <title>Playlists</title>
  <!-- fonts: connect early and load in parallel with the other stylesheets -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://moodtunes-2avk.onrender.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&amp;family=Outfit:wght@300..700&amp;display=swap" />
  <!-- fetch the other pages early, and fully prepare one as soon as you hover or touch its
       link, so it opens almost instantly (Chrome/Edge; other browsers ignore this) -->
  <script type="speculationrules">
    {
      "prerender": [{ "where": { "href_matches": "/*.html" }, "eagerness": "moderate" }],
      "prefetch": [{ "where": { "href_matches": "/*.html" }, "eagerness": "eager" }]
    }
  </script>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/playlists.css" />
  <link rel="stylesheet" href="css/mobile.css" />
  <link rel="stylesheet" href="css/motion.css" />
</head>

    </div>
  </nav>
