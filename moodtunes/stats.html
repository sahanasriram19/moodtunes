<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f0f0f" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="images/favicon.png">
  <title>Stats</title>
  <!-- page transitions: declared here (not in motion.css) so Chrome sees the opt-in
       before the new page is shown — otherwise it sometimes skips the transition -->
  <style>
    @view-transition { navigation: auto; }
    @media (prefers-reduced-motion: reduce) { @view-transition { navigation: none; } }
  </style>
  <!-- don't reveal this page until #mt-ready (after the scripts) is parsed, so the
       transition lands on the finished page — glow, mood colour and content included -->
  <link rel="expect" href="#mt-ready" blocking="render" />
  <!-- fonts: connect early and load in parallel with the other stylesheets -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://moodtunes-2avk.onrender.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&amp;family=Outfit:wght@300..700&amp;display=swap" />
  <!-- start fetching a page when you hover its link (Chrome/Edge; ignored elsewhere) -->
  <script type="speculationrules">
    { "prefetch": [{ "where": { "href_matches": "/*" }, "eagerness": "moderate" }] }
  </script>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/stats.css" />
  <link rel="stylesheet" href="css/mobile.css" />
  <link rel="stylesheet" href="css/motion.css" />
</head>
<body>
  <nav class="navbar">
      <img src="images/moodtunes_logo.png" class="logo" alt="moodtunes logo">
        <ul class="nav-links">
      <li><a href="index.html">journal</a></li>
      <li><a href="playlists.html">playlists</a></li>
      <li><a href="session.html">session</a></li>
      <li><a href="history.html">history</a></li>
      <li><a href="stats.html" >stats</a></li>
  
    </ul>
    <div class="nav-right">
      <button class="session-btn" id="session-btn">▶ start session</button>
      <button class="help-btn" id="help-btn" title="how to use moodtunes" style="background:none;border:1.5px solid #2a2a2a;color:#555;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:15px;font-weight:700;flex-shrink:0;transition:all 0.2s;">?</button>
    </div>
  </nav>

  <main class="container">
    <div id="stats-content">
      <p style="color:#555;font-size:14px;">loading your stats...</p>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/mood.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/help.js"></script>
  <script src="js/profile.js"></script>
  <div id="mt-ready" hidden></div>
</body>
</html>
