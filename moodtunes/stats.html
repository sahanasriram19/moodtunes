<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- installable app (PWA) -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f0f0f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="moodtunes" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="images/favicon.png" />
  <title>Login</title>
  <!-- fonts: connect early and load in parallel with the other stylesheets -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://moodtunes-2avk.onrender.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&amp;family=Outfit:wght@300..700&amp;display=swap" />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <div class="auth-container">
    <div class="auth-box">
      <img src="images/moodtunes_logo.png" class="auth-logo-img" alt="moodtunes logo">
      <p class="auth-tagline">your music. your mood. your story.</p>

      <div class="auth-tabs">
        <button class="auth-tab active" id="login-tab">login</button>
        <button class="auth-tab" id="register-tab">register</button>
      </div>

      <div id="login-form">
        <div class="auth-field">
          <label>username</label>
          <input type="text" id="login-username" placeholder="your username" />
        </div>
        <div class="auth-field">
          <label>password</label>
          <input type="password" id="login-password" placeholder="your password" />
        </div>
        <button class="auth-btn" id="login-btn">login</button>
        <p class="auth-error" id="login-error"></p>
      </div>

      <div id="register-form" style="display:none;">
        <div class="auth-field">
          <label>username</label>
          <input type="text" id="reg-username" placeholder="choose a username" />
        </div>
        <div class="auth-field">
          <label>email</label>
          <input type="email" id="reg-email" placeholder="your email" />
        </div>
        <div class="auth-field">
          <label>password</label>
          <input type="password" id="reg-password" placeholder="choose a password" />
        </div>
        <button class="auth-btn" id="register-btn">create account</button>
        <p class="auth-error" id="register-error"></p>
      </div>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
