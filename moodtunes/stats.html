<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="color-scheme" content="dark" />
  <style>html{background:#120a20;color-scheme:dark}</style>
  <script>
    (function () {
      var bg = { default: '#120a20', warm: '#0a0a0a', ocean: '#071821', light: '#f8f8f6' };
      var t = 'default';
      try { t = localStorage.getItem('moodtunes_theme') || 'default'; } catch (e) {}
      if (t === 'purple') { t = 'ocean'; try { localStorage.setItem('moodtunes_theme', t); } catch (e) {} }
      if (!bg[t]) t = 'default';
      var root = document.documentElement;
      root.setAttribute('data-theme', t);
      root.style.background = bg[t];
      root.style.colorScheme = t === 'light' ? 'light' : 'dark';
      var meta = document.querySelector('meta[name="color-scheme"]');
      if (meta) meta.content = t === 'light' ? 'light' : 'dark';
    })();
  </script>
  <script>
    (function () {
      var root = document.documentElement;
      function enter() {
        root.classList.remove('mt-enter');
        void root.offsetWidth;
        root.classList.add('mt-enter');
      }
      if (document.prerendering) document.addEventListener('prerenderingchange', enter, { once: true });
      else enter();
      addEventListener('pageshow', function (e) {
        if (e.persisted) {
          root.classList.remove('mt-leave');
          enter();
        }
      });
    })();
  </script>
