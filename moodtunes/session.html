<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f0f0f" />
  <link rel="manifest" href="manifest.json" />
  <title>moodtunes — session</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/mobile.css" />
  <style>
    .hidden { display: none !important; }

    .session-hero {
      background: #141414;
      border: 1px solid #222;
      border-radius: 16px;
      padding: 40px 32px;
      text-align: center;
      margin: 24px 0 32px;
    }

    .session-hero-label {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #555;
      margin-bottom: 16px;
    }

    .session-hero-timer {
      font-size: 64px;
      font-weight: 300;
      color: #f0f0f0;
      letter-spacing: -2px;
      font-variant-numeric: tabular-nums;
      line-height: 1;
      margin-bottom: 28px;
    }

    .session-hero-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    #session-start-btn {
      background: #7f77dd;
      border: none;
      border-radius: 20px;
      color: #fff;
      font-size: 13px;
      padding: 10px 24px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    #session-start-btn:hover { opacity: 0.85; }

    #session-end-btn {
      background: #c0392b;
      border: none;
      border-radius: 20px;
      color: #fff;
      font-size: 13px;
      padding: 10px 20px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    #session-end-btn:hover { opacity: 0.85; }

    #session-refresh-btn {
      background: none;
      border: 1px solid #333;
      border-radius: 20px;
      color: #888;
      font-size: 13px;
      padding: 10px 18px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    #session-refresh-btn:hover { border-color: #555; color: #ccc; }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="logo">mood<span>tunes</span></div>
    <ul class="nav-links">
      <li><a href="index.html">journal</a></li>
      <li><a href="playlists.html">playlists</a></li>
      <li><a href="history.html">history</a></li>
      <li><a href="stats.html">stats</a></li>
      <li><a href="session.html" class="active">session</a></li>
    </ul>
    <div class="nav-right">
      <button class="logout-btn" id="logout-btn">logout</button>
    </div>
  </nav>

  <main class="container">

    <!-- mood chips -->
    <section class="mood-section">
      <p class="section-label">pick a mood to start your session</p>
      <div class="mood-chips">
        <button class="chip" data-mood="happy">happy</button>
        <button class="chip" data-mood="sad">sad</button>
        <button class="chip" data-mood="hype">hype</button>
        <button class="chip" data-mood="heartbreak">heartbreak</button>
        <button class="chip" data-mood="nostalgic">nostalgic</button>
        <button class="chip" data-mood="focused">focused</button>
        <button class="chip" data-mood="chill">chill</button>
      </div>
    </section>

    <!-- timer hero -->
    <div id="session-controls" class="session-hero hidden">
      <div id="session-mood-label" class="session-hero-label"></div>
      <div id="session-timer" class="session-hero-timer">00:00</div>
      <div class="session-hero-actions">
        <button id="session-refresh-btn" class="hidden">↻ refresh</button>
        <button id="session-start-btn" class="hidden">▶ start session</button>
        <button id="session-end-btn" class="hidden">■ end session</button>
      </div>
    </div>

    <!-- recommendations -->
    <section>
      <div id="discover-content"></div>
    </section>

  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/session.js"></script>
</body>
</html>
