<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="moodtunes" />
  <meta name="theme-color" content="#0f0f0f" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <title>moodtunes — session</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/mobile.css" />
  <style>
    .session-timer-card {
      background: #141414;
      border: 1px solid #7f77dd33;
      border-radius: 14px;
      padding: 24px 20px;
      text-align: center;
      margin-bottom: 24px;
    }
    .session-timer-label {
      font-size: 11px;
      color: #555;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }
    .session-timer-display {
      font-size: 44px;
      font-weight: 600;
      color: #f0f0f0;
      letter-spacing: 0.04em;
      font-variant-numeric: tabular-nums;
      margin-bottom: 16px;
    }
    .session-timer-btns {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .session-start-btn {
      background: #7f77dd;
      border: none;
      border-radius: 20px;
      color: #fff;
      padding: 8px 20px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 500;
    }
    .session-refresh-btn {
      background: none;
      border: 1px solid #333;
      color: #888;
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 13px;
      cursor: pointer;
    }
    .session-end-btn {
      background: #e05c5c22;
      border: 1px solid #e05c5c;
      color: #e05c5c;
      border-radius: 20px;
      padding: 8px 16px;
      font-size: 13px;
      cursor: pointer;
    }
    .recs-label {
      font-size: 11px;
      color: #555;
      letter-spacing: 0.06em;
      margin-bottom: 10px;
    }
    .recs-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 12px;
    }
    @media (max-width: 768px) {
      .recs-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
      }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="logo">mood<span>tunes</span></div>
    <ul class="nav-links">
      <li><a href="index.html">journal</a></li>
      <li><a href="playlists.html">playlists</a></li>
      <li><a href="history.html">history</a></li>
      <li><a href="session.html" class="active">session</a></li>
    </ul>
    <button class="logout-btn" id="logout-btn">logout</button>
  </nav>

  <main class="container">

    <section class="mood-section">
      <p class="section-label">what mood are you in?</p>
      <div class="mood-chips">
        <button class="chip" data-mood="happy">happy</button>
        <button class="chip" data-mood="sad">sad</button>
        <button class="chip" data-mood="hype">hype</button>
        <button class="chip" data-mood="heartbreak">heartbreak</button>
        <button class="chip" data-mood="nostalgic">nostalgic</button>
        <button class="chip" data-mood="focused">focused</button>
        <button class="chip" data-mood="chill">chill</button>
      </div>
    </section>

    <!-- session timer card -->
    <div id="session-controls" class="hidden">
      <div class="session-timer-card">
        <div class="session-timer-label" id="session-mood-label">session</div>
        <div class="session-timer-display" id="session-timer">00:00</div>
        <div class="session-timer-btns">
          <button class="session-start-btn" id="session-start-btn">▶ start session</button>
          <button class="session-refresh-btn hidden" id="session-refresh-btn">↻ refresh</button>
          <button class="session-end-btn hidden" id="session-end-btn">■ end session</button>
        </div>
      </div>

      <div class="recs-label">RECOMMENDED</div>
      <div id="discover-content">
        <p style="color:#555;font-size:13px;">pick a mood above to get recommendations</p>
      </div>
    </div>

    <div id="no-session-prompt" style="color:#555;font-size:14px;margin-top:20px;">
      pick a mood above to get started
    </div>

  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/session.js"></script>

</body>
</html>
