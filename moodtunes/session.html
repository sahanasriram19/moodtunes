<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <!-- installable app (PWA) -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f0f0f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="moodtunes" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <link rel="icon" type="image/png" href="images/favicon.png" />
  <title>Session</title>
  <!-- page transitions: declared here (not in motion.css) so Chrome sees the opt-in
       before the new page is shown — otherwise it sometimes skips the transition -->
  <style>
    @view-transition { navigation: auto; }
    @media (prefers-reduced-motion: reduce) { @view-transition { navigation: none; } }
  </style>
  <!-- don't reveal this page until #mt-ready (after the scripts) is parsed, so the
       transition lands on the finished page — glow, mood colour and content included -->
  <link rel="expect" href="#mt-ready" blocking="render" />
  <!-- fonts: connect early and load in parallel with the other stylesheets -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://moodtunes-2avk.onrender.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&amp;family=Outfit:wght@300..700&amp;display=swap" />
  <!-- fetch the other pages early, and fully prepare one as soon as you hover or touch its
       link, so it opens almost instantly (Chrome/Edge; other browsers ignore this) -->
  <script type="speculationrules">
    {
      "prerender": [{ "where": { "href_matches": "/*.html" }, "eagerness": "moderate" }],
      "prefetch": [{ "where": { "href_matches": "/*.html" }, "eagerness": "eager" }]
    }
  </script>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/mobile.css" />
  <link rel="stylesheet" href="css/session.css" />
  <link rel="stylesheet" href="css/motion.css" />
</head>
<body>
  <nav class="navbar">
    <img src="images/moodtunes_logo.png" class="logo" alt="moodtunes logo">
    <ul class="nav-links">
      <li><a href="index.html">journal</a></li>
      <li><a href="playlists.html">playlists</a></li>
      <li><a href="session.html" class="active">session</a></li>
      <li><a href="history.html">history</a></li>
      <li><a href="stats.html">stats</a></li>
    </ul>
    <div class="nav-right">
      <button class="help-btn" id="help-btn" title="how to use moodtunes" style="background:none;border:1.5px solid #2a2a2a;color:#555;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:15px;font-weight:700;flex-shrink:0;transition:all 0.2s;">?</button>
    </div>
  </nav>

  <main class="container">

    <section class="mood-section">
      <p class="section-label">pick a mood to start your session</p>
      <div class="mood-chips">
        <button class="chip" data-mood="happy">happy</button>
        <button class="chip" data-mood="sad">sad</button>
        <button class="chip" data-mood="hype">hype</button>
        <button class="chip" data-mood="heartbreak">heartbreak</button>
        <button class="chip" data-mood="nostalgic">nostalgic</button>
        <button class="chip" data-mood="focused">focused</button>
        <button class="chip" data-mood="chill">chill</button>
      </div>
    </section>

    <div id="session-controls" class="session-hero">
      <div id="session-mood-label" class="session-hero-label"></div>
      <div class="session-timer-circle">
        <div class="ring-art" id="ring-art"></div>
        <svg class="session-ring" viewBox="0 0 270 270" aria-hidden="true">
          <circle class="ring-track" cx="135" cy="135" r="131" />
          <circle class="ring-progress" id="ring-progress" cx="135" cy="135" r="131" />
        </svg>
        <div class="ring-dot-wrap" id="ring-dot"><span class="ring-dot"></span></div>
        <div id="session-timer" class="session-hero-timer">00:00</div>
        <div class="ring-sub" id="ring-sub">minute 1</div>
      </div>
      <div class="session-hero-actions">
        <button id="session-refresh-btn" class="hidden">↻ refresh</button>
        <button id="session-start-btn" class="hidden">▶ start session</button>
        <button id="session-end-btn" class="hidden">■ end session</button>
      </div>
      <!-- live spotify playback -->
      <div id="session-now-playing"></div>
    </div>

    <section>
      <div id="discover-content"></div>
    </section>

  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/mood.js"></script>
  <script src="js/session.js"></script>
  <script src="js/help.js"></script>
  <script src="js/profile.js"></script>
  <div id="mt-ready" hidden></div>
</body>
</html>
